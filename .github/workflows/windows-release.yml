# Builds the Windows (x64) VST3 for an existing GitHub release and
# attaches the zip to it, then the installer made from that zip (see
# windows-installer.yml). Run it by hand (Actions > Windows release build >
# Run workflow) after the release exists. fcpe.onnx, cent_table.bin,
# and mel_filterbank.bin are in the repository; the BigVGAN model is
# generated by tools/convert_bigvgan.py below because it is ~490 MB and
# never committed (the speech build has no GAME or NSF vocoder model).
name: Windows release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.1.0)"
        required: true
      ref:
        description: "Test build: build this branch or commit instead of the tag and keep the zip as a workflow artifact (the release is not changed)"
        required: false
        default: ""

permissions:
  contents: write
  # The reusable windows-installer.yml workflow requests actions: read (it
  # downloads the test-build artifact); a caller that sets any permission
  # explicitly must grant it, or workflow validation fails at startup.
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive
          persist-credentials: false

      # The BigVGAN model (~490 MB) is generated, never committed. The
      # speech build offers AI Resynthesis only when the file is present,
      # so the release build produces it the same way a local developer
      # would, and the Package step ships it in the zip's models folder.
      - name: Set up Python for BigVGAN model conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BigVGAN conversion dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install onnx==1.23.2 onnxscript==0.7.2 onnxruntime==1.19.2 huggingface_hub==2.4.0 matplotlib scipy librosa

      - name: Prepare BigVGAN model
        run: python tools/convert_bigvgan.py

      # Release tags keep the original Kinu Tune identity. Test builds from a branch
      # use the separate FlexaTune identity so both can coexist in a DAW.
      # Use the runner's default Visual Studio generator (as upstream PitchNet
      # does). DirectML is on so the ONNX models (BigVGAN included) can run
      # on the GPU, with the redistributable DirectML.dll bundled next to
      # the plug-in instead of depending on the inbox Windows version; the
      # vocoders fall back to the CPU where DirectML cannot run.
      - name: Configure
        env:
          DEV_BUILD: ${{ inputs.ref != '' }}
        run: cmake -B build -DUSE_DIRECTML=ON -DUSE_BUNDLED_DIRECTML_RUNTIME=ON -DPITCHNET_DEV_BUILD=$env:DEV_BUILD -DPITCHNET_ARA_DIAGNOSTICS=OFF -DPITCHNET_BUILD_TESTS=OFF

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel

      # Nothing is attached if the plug-in cannot be created like a host does
      # it, including under an older Visual C++ runtime. See the script.
      - name: Check the VST3 like a host does
        shell: pwsh
        env:
          DEV_BUILD: ${{ inputs.ref != '' }}
        run: |
          $product = if ($env:DEV_BUILD -eq "true") { "FlexaTune" } else { "Kinu Tune" }
          ./tools/windows/check-vst3.ps1 -Vst3 "build/PitchNetPlugin_artefacts/Release/VST3/$product.vst3"

      - name: Package
        shell: pwsh
        env:
          DEV_BUILD: ${{ inputs.ref != '' }}
        run: |
          $product = if ($env:DEV_BUILD -eq "true") { "FlexaTune" } else { "Kinu Tune" }
          $version = "$env:RELEASE_TAG".TrimStart('v')
          $prefix = if ($env:DEV_BUILD -eq "true") { "FlexaTune" } else { "Kinu-Tune" }
          $name = "$prefix-$version-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$name/models", "$name/licenses" | Out-Null
          Copy-Item -Recurse "build/PitchNetPlugin_artefacts/Release/VST3/$product.vst3" "$name/"
          foreach ($f in "fcpe.onnx", "cent_table.bin", "mel_filterbank.bin") {
            Copy-Item "Resources/models/$f" "$name/models/"
          }
          # AI Resynthesis model, generated above; the plug-in offers the
          # engine only when this file is in the models folder, and the
          # installer copies the whole folder (see windows-installer.yml).
          $bigvganModel = "Resources/models/bigvgan_v2_44khz_128band.onnx"
          if (Test-Path $bigvganModel) {
            Copy-Item $bigvganModel "$name/models/"
          }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, MODIFICATIONS.md "$name/"
          Copy-Item licenses/* "$name/licenses/"
          Copy-Item packaging/INSTALL-Windows.txt "$name/INSTALL.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach to the release
        if: ${{ inputs.ref == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ZIP_NAME.zip" --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Keep the test build as a workflow artifact
        if: ${{ inputs.ref != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}-test
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 7

  installer:
    needs: windows-x64
    if: ${{ inputs.ref == '' }}
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ inputs.tag }}
      attach: true
