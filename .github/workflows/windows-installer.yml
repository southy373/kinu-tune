# Builds an installer from a release zip or an existing test-build artifact.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for Kinu Tune) or version (for FlexaTune)"
        required: true
        default: "v0.1.4"
      pure_tune:
        description: "Build the separate FlexaTune installer from a test-build run"
        type: boolean
        default: false
      artifact_run_id:
        description: "Required for FlexaTune: successful Windows build run ID"
        required: false
      attach:
        description: "Attach the installer to a release (normally leave off for FlexaTune)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      attach:
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout JUCE
        run: git submodule update --init --depth 1 third_party/JUCE

      - name: Download package and Visual C++ Redistributable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PURE_TUNE: ${{ inputs.pure_tune }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v')
          if ($env:PURE_TUNE -eq "true") {
            if (-not $env:ARTIFACT_RUN_ID) { throw "FlexaTune requires artifact_run_id" }
            $product = "FlexaTune"
            $stem = "Pure-Tune-$version-Windows-x64"
            gh run download "$env:ARTIFACT_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "$stem-test" --dir downloaded
            $zip = Join-Path (Resolve-Path downloaded) "$stem.zip"
            Expand-Archive $zip -DestinationPath stage
            $stageDir = Join-Path (Resolve-Path stage) $stem
          } else {
            $product = "Kinu Tune"
            $stem = "Kinu-Tune-$version-Windows-x64"
            gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "$stem.zip"
            Expand-Archive "$stem.zip" -DestinationPath stage
            $stageDir = Join-Path (Resolve-Path stage) $stem
          }
          if (-not (Test-Path (Join-Path $stageDir "$product.vst3"))) { throw "package does not contain $product.vst3" }
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
          $sig = Get-AuthenticodeSignature vc_redist.x64.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "vc_redist.x64.exe signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRODUCT=$product" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_STEM=$($product -replace ' ', '-')-$version-Windows-x64-Setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress | Out-Host }
          if ($env:PRODUCT -eq "FlexaTune") {
            $appId = "7997E5BE-A7F9-477C-9593-136E3E5FB98F"
          } else {
            $appId = "38373E75-C136-4F15-8F5D-6F966750C257"
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DStageDir=$env:STAGE_DIR" "/DRedist=$(Join-Path $PWD 'vc_redist.x64.exe')" "/DProductName=$env:PRODUCT" "/DProductAppId=$appId" "/O$(Join-Path $PWD 'Output')" "packaging/windows/FlexaTune.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "SETUP_NAME=$env:SETUP_STEM.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check the Kinu Tune installer on a clean Windows
        if: ${{ !inputs.pure_tune }}
        shell: pwsh
        run: ./tools/windows/check-installer.ps1 -Setup "Output/$env:SETUP_NAME"

      - name: Keep installer as a workflow artifact
        if: ${{ !inputs.attach || inputs.pure_tune }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SETUP_NAME }}
          path: Output/${{ env.SETUP_NAME }}
          retention-days: 7

      - name: Attach Kinu Tune installer to release
        if: ${{ inputs.attach && !inputs.pure_tune }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" "Output/$env:SETUP_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber
